<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 3 - Galería y Multimedia</title>
</head>

<body>

    <h1>Actividad 3: Galería y Multimedia</h1>

    <!-- GALERÍA -->
    <section>

        <h2>Galería</h2>

        <img src="imagenes/imagen1.jpg"
             alt="Primera imagen de la galería"
             width="300"
             height="400">

        <img src="imagenes/imagen2.jpg"
             alt="Segunda imagen de la galería"
             width="300"
             height="400">

        <img src="imagenes/imagen3.jpg"
             alt="Tercera imagen de la galería"
             width="300"
             height="400">

    </section>


    <!-- VIDEO -->
    <section>

        <h2>Video</h2>

        <video controls
               width="500"
               height="300"
               poster="imagenes/imagen1.jpg">

            <source src="videos/video.mp4" type="video/mp4">

            <source src="videos/video.webm" type="video/webm">

            Tu navegador no soporta la reproducción de video.

        </video>

    </section>


    <!-- AUDIO -->
    <section>

        <h2>Audio</h2>

        <audio controls>

            <source src="audio/audio.mp3" type="audio/mpeg">

            Tu navegador no soporta la reproducción de audio.

        </audio>

    </section>

</body>

</html>
